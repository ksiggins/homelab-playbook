---
- name: Validate TLS deployment before mutation
  ansible.builtin.import_tasks: preflight.yml

- name: Install TLS runtime packages
  ansible.builtin.package:
    name:
      - ca-certificates
      - openssl
      - python3
      - python3-cryptography
    state: present

- name: Establish the dedicated issuer identity
  ansible.builtin.import_tasks: identity.yml

- name: Install TLS runtime and host state
  ansible.builtin.import_tasks: install.yml

- name: Configure TLS policy and units
  ansible.builtin.import_tasks: configure.yml

- name: Reconcile the TLS renewal timer
  ansible.builtin.import_tasks: timer.yml
